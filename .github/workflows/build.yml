name: Build images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.variant }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [patched, baseline]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bzip2 cpio file git patch perl python3 \
            rsync unzip wget zstd libelf-dev libssl-dev

      # Source tarballs and the external toolchain. Same for both variants;
      # changes only when the Buildroot version or the configuration does.
      - name: Restore download cache
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('Makefile', 'configs/flickerfix_defconfig') }}
          restore-keys: dl-

      # Compiler cache. A cache entry cannot be overwritten, so every run
      # saves under a new key and restores the most recent one.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.variant }}-
            ccache-

      - name: Build
        run: make ${{ matrix.variant }}

      - name: ccache statistics
        id: stat
        if: always()
        run: |
          ccache=output/${{ matrix.variant }}/host/bin/ccache
          [ -x "$ccache" ] && CCACHE_DIR=$PWD/ccache "$ccache" -s || true
          # Tell the save steps which cache directories have content.
          for d in dl ccache; do
            [ -n "$(ls -A $d 2>/dev/null)" ] && echo "$d=true" >> "$GITHUB_OUTPUT"
          done
          du -sh dl ccache 2>/dev/null || true

      # Saved even when the build fails, so a retry does not start cold.
      - name: Save download cache
        if: always() && steps.dl.outputs.cache-hit != 'true' && steps.stat.outputs.dl == 'true'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      - name: Save ccache
        if: always() && steps.stat.outputs.ccache == 'true'
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The image is mostly the empty results partition; it compresses well.
      - name: Compress image
        run: |
          ls -l flickerfix-${{ matrix.variant }}.img output/${{ matrix.variant }}/images/
          zstd -T0 -10 --rm flickerfix-${{ matrix.variant }}.img

      - uses: actions/upload-artifact@v4
        with:
          name: flickerfix-${{ matrix.variant }}
          path: flickerfix-${{ matrix.variant }}.img.zst
          compression-level: 0
          if-no-files-found: error

  # Publish the images of the main branch as a release, so they can be
  # downloaded without a GitHub login (workflow artifacts need one).
  release:
    name: publish latest release
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l
          sha256sum flickerfix-*.img.zst > SHA256SUMS
          echo "${GITHUB_SHA}" > COMMIT
          # The tag has to move to this commit, so recreate the release.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest --target "$GITHUB_SHA" \
            --title "Latest test images" \
            --notes "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}. Replaced on every push to main. Write to a USB drive with tools/flash-usb.sh." \
            flickerfix-patched.img.zst flickerfix-baseline.img.zst SHA256SUMS COMMIT
