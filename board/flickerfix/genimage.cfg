# Sized to fit drives sold as "4 GB" (about 3.7 GiB usable).
image esp.vfat {
	vfat {
		label = "FFBOOT"
		file EFI/BOOT/BOOTX64.EFI {
			image = "flickerfix.efi"
		}
	}
	size = 512M
}

image results.vfat {
	vfat {
		label = "FFRESULTS"
		extraargs = "-F 32"
		file README.txt {
			image = "results-README.txt"
		}
		file flickerfix.conf {
			image = "flickerfix.conf"
		}
	}
	size = 3072M
}

image flickerfix.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		partition-type-uuid = "U"
		bootable = true
		image = "esp.vfat"
	}

	partition results {
		partition-type-uuid = "F"
		image = "results.vfat"
	}
}
